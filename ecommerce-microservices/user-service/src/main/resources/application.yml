spring:
  application:
    name: user-service
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970  # 256-bit hex key
  access-token-expiration: 900000       # 15 minutes in ms
  refresh-token-expiration: 604800000   # 7 days in ms

# eureka client omitted — spring-cloud-commons 4.1.0 is incompatible with SB4.x

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
