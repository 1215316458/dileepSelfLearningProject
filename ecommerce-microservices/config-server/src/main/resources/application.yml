server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native   # "native" = serve config from local filesystem (no Git needed)
  cloud:
    config:
      server:
        native:
          # Config files live in src/main/resources/config/
          # Naming convention: {application-name}.yml or {application-name}-{profile}.yml
          search-locations: classpath:/config/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
