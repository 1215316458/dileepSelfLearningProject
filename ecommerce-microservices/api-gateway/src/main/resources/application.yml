server:
  port: 8080

spring:
  application:
    name: api-gateway

jwt:
  # Must match the secret in user-service JwtService
  # In production: inject from environment variable or Config Server
  secret: ecommerce-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    console: "%d{HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
